<!doctype html>
<html lang="en">
<head>
  <title>sobi's portfolio</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio Website</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    .hero-carousel,
    .hero-carousel .carousel-inner,
    .hero-carousel .carousel-item {
      height: 100vh;
    }

    .hero-carousel .carousel-item img {
      height: 100vh;
      width: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 226, 226, 0.65) 0%,
        rgba(238, 71, 71, 0.25) 55%,
        rgba(191, 186, 186, 0.15) 100%
      );
    }

    section {
      scroll-margin-top: 90px;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#top">
      <i class="bi bi-grid-1x2-fill me-2"></i>YourBrand
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#gallery1">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="#stats">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#gallery2">More</a></li>
        <li class="nav-item"><a class="nav-link" href="#footer">Footer</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HERO CAROUSEL -->
<header id="top">
  <div id="heroCarousel" class="carousel slide hero-carousel" data-bs-ride="carousel">
    
    <div class="carousel-inner">

      <div class="carousel-item active position-relative">
        <img src="https://picsum.photos/id/1018/1920/1080" class="d-block w-100" alt="">
        <div class="hero-overlay"></div>
        <div class="carousel-caption text-start">
          <h1 class="fw-bold">A clean Bootstrap website</h1>
          <p>Responsive layout with carousel and galleries</p>
        </div>
      </div>

      <div class="carousel-item position-relative">
        <img src="https://picsum.photos/id/1015/1920/1080" class="d-block w-100" alt="">
        <div class="hero-overlay"></div>
        <div class="carousel-caption">
          <h2 class="fw-bold">Full screen carousel</h2>
        </div>
      </div>

      <div class="carousel-item position-relative">
        <img src="https://picsum.photos/id/1005/1920/1080" class="d-block w-100" alt="">
        <div class="hero-overlay"></div>
        <div class="carousel-caption text-end">
          <h2 class="fw-bold">Mobile-first design</h2>
        </div>
      </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>
</header>

<!-- GALLERY 1 -->
<section id="gallery1" class="py-5">
  <div class="container">
    <h2 class="fw-bold mb-4">Gallery</h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      
      <div class="col">
        <div class="card">
          <img src="https://picsum.photos/seed/a/800/600" class="card-img-top">
        </div>
      </div>

      <div class="col">
        <div class="card">
          <img src="https://picsum.photos/seed/b/800/600" class="card-img-top">
        </div>
      </div>

      <div class="col">
        <div class="card">
          <img src="https://picsum.photos/seed/c/800/600" class="card-img-top">
        </div>
      </div>

    </div>
  </div>
</section>

<!-- STATS -->
<section id="stats" class="py-5 bg-light">
  <div class="container">
    <h2 class="fw-bold mb-4">Dashboard</h2>

    <div class="row g-4">

      <div class="col-md-3">
        <div class="card p-3 text-center">
          <i class="bi bi-graph-up fs-2"></i>
          <h3>1248</h3>
          <p>Visitors</p>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card p-3 text-center">
          <i class="bi bi-check-circle fs-2"></i>
          <h3>96%</h3>
          <p>Satisfaction</p>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card p-3 text-center">
          <i class="bi bi-lightning fs-2"></i>
          <h3>320</h3>
          <p>Downloads</p>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card p-3 text-center">
          <i class="bi bi-star fs-2"></i>
          <h3>4.9</h3>
          <p>Rating</p>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- GALLERY 2 -->
<section id="gallery2" class="py-5">
  <div class="container">
    <h2 class="fw-bold mb-4">More Images</h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      
      <div class="col"><img src="https://picsum.photos/seed/1/800/600" class="img-fluid"></div>
      <div class="col"><img src="https://picsum.photos/seed/2/800/600" class="img-fluid"></div>
      <div class="col"><img src="https://picsum.photos/seed/3/800/600" class="img-fluid"></div>

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer id="footer" class="mt-auto bg-dark text-white text-center py-4">
  <p>© <span id="year"></span> YourBrand</p>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
